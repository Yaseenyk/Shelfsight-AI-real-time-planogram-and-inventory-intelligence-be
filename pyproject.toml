[project]
name = "shelfsight-backend"
version = "0.1.0"
description = "ShelfSight AI — real-time planogram and inventory intelligence (FastAPI backend)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["runs", "evaluation/reports", ".venv"]

[tool.ruff.lint]
# `UP` is deliberately excluded: it rewrites annotations to 3.11-only syntax
# (PEP 604/585, StrEnum), and the codebase stays readable on 3.10 interpreters
# that students and lab machines still run.
select = ["E", "F", "I", "B", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends()/File() defaults are the documented idiom
    "B905",  # zip() lengths are guaranteed by construction at every call site
    "E501",  # long lines are caught by the formatter
]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"app/schemas/__init__.py" = ["F401"]
"app/db/init_db.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
